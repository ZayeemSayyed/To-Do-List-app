<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #16213e;
      padding: 40px;
      border-radius: 16px;
      width: 450px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      color: #e94560;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #0f3460;
      border-radius: 8px;
      background: #0f3460;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #e94560; }

    input::placeholder { color: #888; }

    button.add-btn {
      padding: 12px 20px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
    }

    button.add-btn:hover { background: #c73652; }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f3460;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .task span {
      flex: 1;
      color: white;
      font-size: 16px;
    }

    .task.done span {
      text-decoration: line-through;
      color: #888;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex: none;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #e94560;
      font-size: 18px;
      cursor: pointer;
    }

    .delete-btn:hover { color: white; }

    .stats {
      text-align: center;
      color: #888;
      margin-top: 20px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 My To-Do List</h1>
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button class="add-btn" onclick="addTask()">+</button>
    </div>
    <div id="taskList"></div>
    <p class="stats" id="stats"></p>
  </div>

  <script>
    let tasks = [];

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (text === '') return;

      tasks.push({ text: text, done: false });
      input.value = '';
      renderTasks();
    }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const stats = document.getElementById('stats');

      if (tasks.length === 0) {
        list.innerHTML = '<p class="empty">No tasks yet. Add one above! 🎯</p>';
        stats.textContent = '';
        return;
      }

      list.innerHTML = tasks.map((task, i) => `
        <div class="task ${task.done ? 'done' : ''}">
          <input type="checkbox" ${task.done ? 'checked' : ''} 
                 onchange="toggleTask(${i})">
          <span>${task.text}</span>
          <button class="delete-btn" onclick="deleteTask(${i})">🗑️</button>
        </div>
      `).join('');

      const done = tasks.filter(t => t.done).length;
      stats.textContent = `${done} of ${tasks.length} tasks completed`;
    }

    renderTasks();
  </script>
</body>
</html>
